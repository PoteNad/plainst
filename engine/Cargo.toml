[package]
name = "plainst-engine"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
typst = "=0.15.1"
typst-syntax = "=0.15.1"
typst-pdf = "=0.15.1"
typst-render = "=0.15.1"
typst-layout = "=0.15.1"
typst-ide = "=0.15.1"
codex = "=0.3.0"
# Maps installed fonts instead of copying them; Typst's font scanner already uses it.
memmap2 = "=0.9.11"
# The same syntax highlighter Typst uses, for colouring code blocks in the editor.
syntect = { version = "=5.3.0", default-features = false, features = ["parsing", "regex-fancy"] }
typst-kit = { version = "=0.15.1", default-features = false, features = ["scan-fonts", "embedded-fonts", "datetime"] }
typst-assets = { version = "=0.15.1", features = ["fonts"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
