name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  actions: read
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6

      - name: Select the newest Xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          printf 'macOS SDK %s\n' "$(xcrun --sdk macosx --show-sdk-version)"

      - name: Restore Rust build
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            engine/target
          key: engine-v2-${{ runner.os }}-${{ hashFiles('engine/Cargo.lock') }}
          restore-keys: engine-v2-${{ runner.os }}-

      # CI already runs every check on each commit pushed to main. Wait for that result instead
      # of repeating it, and run the checks here only when CI never saw this commit.
      - name: Require passing checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs() {
            gh run list --repo "$GITHUB_REPOSITORY" --workflow CI --commit "$GITHUB_SHA" \
              --json status,conclusion --jq "$1"
          }
          if [ "$(runs 'length')" = "0" ]; then
            echo "CI has not run on $GITHUB_SHA, so running the checks here."
            ./scripts/check.sh
            exit 0
          fi
          while [ "$(runs 'map(select(.status != "completed")) | length')" != "0" ]; do
            echo "Waiting for CI on $GITHUB_SHA…"
            sleep 30
          done
          if [ "$(runs 'map(select(.conclusion == "success")) | length')" = "0" ]; then
            echo "CI did not pass on $GITHUB_SHA." >&2
            exit 1
          fi
          echo "CI passed on $GITHUB_SHA."

      - name: Build and package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./scripts/release.sh "$VERSION"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "dist/Plainst-$VERSION-macOS.zip" \
            "dist/Plainst-$VERSION-macOS.zip.sha256" \
            "dist/Plainst-macOS.zip" \
            "dist/Plainst-$VERSION-macOS.dmg" \
            "dist/Plainst-$VERSION-macOS.dmg.sha256" \
            "dist/Plainst-macOS.dmg" \
            --generate-notes \
            --title "Plainst $VERSION"
